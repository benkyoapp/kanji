<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>カンジ・ロワイヤル</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カンジ">
<meta name="theme-color" content="#0c1c36">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Klee+One:wght@600&display=swap">
<style>
:root{
  --bg:#0c1c36; --panel:#16305a; --panel2:#1c3b6b; --edge:#28528d; --deep:#081429;
  --text:#f2f6ff; --muted:#a3b6da; --dim:#6f86b0;
  --go:#ffd23f; --go-edge:#b88a00; --go-ink:#211800;
  --ok:#33d18a; --ok-edge:#179158; --ng:#ff6b5b; --ng-edge:#bf3a2c;
  --storm:#8b5cff; --storm-deep:#3a1d8a;
  --paper:#fffdf4; --grid:#e39a9a; --grid2:#f2c9c9; --ink:#1a1a1a;
  --legend:#ffb52e; --epic:#b86cff; --rare:#3ea3ff; --unc:#4fd66a; --com:#9fabbd;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --kyokasho:"Klee One","YuKyokasho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--text);font-family:var(--ui);font-weight:500;font-size:16px;line-height:1.6;
  background:
    radial-gradient(1100px 520px at 85% -12%,rgba(46,120,190,.55),transparent 62%),
    radial-gradient(900px 480px at -12% 112%,rgba(20,110,120,.45),transparent 60%),
    var(--bg);
  background-attachment:fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:3px}
.app{max-width:1000px;margin:0 auto;padding-block:14px 110px}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:26px;border-radius:6px;background:var(--go);color:var(--go-ink);font-style:normal;
  display:grid;place-items:center;font-size:15px;transform:skew(-8deg)}
.lv{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:14px}
.xpbar{width:120px;height:10px;border-radius:6px;background:var(--deep);overflow:hidden;border:1px solid var(--edge)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#39c2ff,#7ef0c6)}
.streak{font-size:13px;color:var(--muted)} .streak b{font-family:var(--display);color:var(--go);font-size:17px;font-weight:400}
.sync{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.on::before{background:var(--ok)}
.mute{font-size:12px;color:var(--muted);border:1px solid var(--edge);border-radius:20px;padding:3px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 20px;font-weight:800;
  background:var(--panel2);box-shadow:0 5px 0 var(--deep);transition:transform .06s,box-shadow .06s;min-height:52px;font-size:16px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.go{background:var(--go);color:var(--go-ink);box-shadow:0 5px 0 var(--go-edge)}
.btn.go:active{box-shadow:0 2px 0 var(--go-edge)}
.btn.ok{background:var(--ok);color:#03281a;box-shadow:0 5px 0 var(--ok-edge)}
.btn.ng{background:var(--ng);color:#2e0600;box-shadow:0 5px 0 var(--ng-edge)}
.btn.storm{background:var(--storm);color:#fff;box-shadow:0 5px 0 var(--storm-deep)}
.btn.ghost{background:transparent;border:2px solid var(--edge);box-shadow:none}
.btn.big{font-size:20px;min-height:64px;padding:14px 28px;font-family:var(--display);font-weight:400;letter-spacing:.04em}
.plate{display:inline-block;transform:skew(-9deg);background:var(--go);color:var(--go-ink);padding:2px 12px;border-radius:4px}
.plate>span{display:inline-block;transform:skew(9deg);font-weight:800;font-size:12px;letter-spacing:.08em}
.plate.st{background:var(--storm);color:#fff}
.plate.rv{background:var(--ng);color:#2e0600}

/* panels */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--edge);border-radius:22px;padding:22px;
  box-shadow:0 8px 0 var(--deep)}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:13px}

/* season */
.season-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;margin-bottom:16px}
.season-top h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:6px 0 0;line-height:1.15}
.season-top .when{color:var(--muted);font-size:14px}
.season-top .when b{color:var(--go);font-family:var(--display);font-weight:400;font-size:20px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:4px 0 18px}
.day{background:var(--deep);border-radius:12px;padding:8px 4px 9px;text-align:center;border:2px solid transparent;position:relative}
.day .dd{font-size:11px;color:var(--dim)}
.day .dm{font-weight:800;font-size:13px;line-height:1.3}
.day.today{border-color:var(--go)}
.day.today::after{content:"きょう";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--go);color:var(--go-ink);
  font-size:10px;font-weight:800;padding:0 7px;border-radius:8px}
.day.done{background:rgba(51,209,138,.16)} .day.done .dm::after{content:" ✓";color:var(--ok)}
.day.real{background:rgba(255,107,91,.14)}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-bottom:20px}
.boss{background:var(--deep);border-radius:14px;padding:10px 6px 10px;text-align:center;border:2px solid var(--edge)}
.boss .bk{font-family:var(--display);font-size:38px;line-height:1.15;color:var(--dim)}
.boss.def{border-color:var(--rc);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 30%,var(--deep)),var(--deep))}
.boss.def .bk{font-family:var(--kyokasho);font-weight:600;color:#fff}
.hp{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:9px}
.hp i{width:12px;height:7px;border-radius:2px;background:var(--ng)}
.hp i.x{background:#2a3d5e}
.boss .rn{font-size:10px;font-weight:800;color:var(--rc);margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.acts .btn{flex:1 1 200px}
.empty{text-align:center;padding:30px 16px}
.empty h1{font-family:var(--display);font-weight:400;font-size:26px;margin:10px 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:40ch;font-size:14px}

/* islands */
.islands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.isl{background:linear-gradient(170deg,#1b4b62,#143455);border:2px solid #2a6a86;border-radius:18px;padding:14px 14px 12px;text-align:left;
  box-shadow:0 5px 0 var(--deep);position:relative;overflow:hidden}
.isl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.isl .in{font-family:var(--display);font-size:18px;line-height:1.2}
.isl .id{font-size:11px;color:var(--muted)}
.isl .ik{font-family:var(--kyokasho);font-weight:600;font-size:15px;letter-spacing:.12em;margin:6px 0 8px;color:#cfe6f5;min-height:24px}
.ibar{height:8px;border-radius:5px;background:var(--deep);overflow:hidden}
.ibar i{display:block;height:100%;background:var(--ok)}
.isl .ic{font-size:11px;color:var(--muted);margin-top:5px}
.isl.clear{border-color:var(--legend)}
.isl.clear::after{content:"制覇";position:absolute;top:10px;right:-24px;transform:rotate(35deg);background:var(--legend);color:#2a1a00;
  font-size:11px;font-weight:800;padding:1px 28px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:30px}
.stat{background:var(--deep);border-radius:14px;padding:12px 16px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,20,41,0),rgba(8,20,41,.96) 30%);z-index:5}
.tab{flex:0 1 180px;border-radius:14px;padding:10px 8px;font-weight:800;font-size:14px;background:var(--panel);border:2px solid var(--edge);position:relative;overflow:hidden}
.tab.on{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.tab .hold{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--go)}
.tab.holding .hold{width:100%;transition:width .9s linear}
body.in-session .tabs,body.in-session .hud{display:none}

/* session */
.sess{max-width:900px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.quit{width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);font-size:20px;font-weight:800;flex:none}
.prog{font-family:var(--display);font-size:15px;color:var(--muted);white-space:nowrap}
.pbar{flex:1;height:12px;border-radius:7px;background:var(--deep);overflow:hidden;border:1px solid var(--edge)}
.pbar i{display:block;height:100%;background:var(--go);transition:width .3s}
.sess.storm .pbar i{background:var(--storm)}
.arena{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.foe{display:flex;gap:8px;flex-wrap:wrap}
.foe .boss{min-width:84px;padding:6px 8px}
.foe .boss .bk{font-size:32px}
.foe-l{font-size:12px;color:var(--muted);line-height:1.5}
.foe-l b{color:var(--text);font-size:14px}
.prompt{background:var(--paper);color:#222;border-radius:16px;padding:14px 18px;font-size:clamp(20px,3.2vw,26px);font-weight:800;line-height:1.7;
  margin-bottom:10px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.yomi{display:inline-block;border:3px solid var(--ng);border-radius:8px;padding:0 10px;margin:0 4px;color:#b3261e;background:#fff3f1;line-height:1.5}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px;min-height:21px}
.hint b{color:var(--go)}
.pad-wrap{display:flex;justify-content:center}
.pad{--n:2;width:min(100%,calc(var(--n) * 210px));position:relative;background:var(--paper);border:3px solid var(--grid);border-radius:8px;
  box-shadow:0 6px 0 rgba(0,0,0,.28)}
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.cell{aspect-ratio:1;position:relative;border-right:2px solid var(--grid);container-type:inline-size}
.cell:last-child{border-right:0}
.cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--grid2)}
.cell::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed var(--grid2)}
.g{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kyokasho);font-weight:600;font-size:64px;font-size:74cqw;
  line-height:1;color:transparent;z-index:1;padding-bottom:4%}
.g.guide{color:rgba(20,30,50,.17)} .g.over{color:rgba(214,40,40,.42)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;-webkit-touch-callout:none;cursor:crosshair}
.ans-l{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 6px}
.ans .pad{border-color:var(--ok);box-shadow:none}
.ans .g{color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.ctrl .btn{flex:0 1 auto}
.ctrl .btn.wide{flex:1 1 220px;max-width:340px}
.drillc{font-family:var(--display);font-weight:400}

/* storm meter */
.stormbox{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(139,92,255,.3),rgba(139,92,255,.08));
  border:2px solid var(--storm);border-radius:16px;padding:8px 14px;margin-bottom:12px}
.stormbox svg{width:62px;height:62px;flex:none}
.stormbox .sl{font-weight:800;font-size:14px;line-height:1.5}
.stormbox .sl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stormbox .sc{margin-left:auto;font-family:var(--display);font-size:24px;white-space:nowrap}
.stormbox .sc small{font-size:13px;color:var(--muted)}

/* results */
.result{text-align:center;padding-block:24px}
.result h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,72px);margin:6px 0 4px;line-height:1.1;
  display:inline-block;transform:skew(-8deg)}
.result.win h1{color:var(--go);text-shadow:0 5px 0 var(--go-edge),0 0 40px rgba(255,210,63,.45)}
.result.lose h1{color:#cdb8ff;text-shadow:0 5px 0 var(--storm-deep)}
.result .rsub{color:var(--muted);margin:0 0 20px}
.rstats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.rstats div{background:var(--deep);border-radius:14px;padding:10px 20px;min-width:110px}
.rstats b{font-family:var(--display);font-weight:400;font-size:30px;display:block}
.rstats span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 18px}
.chip{font-family:var(--kyokasho);font-weight:600;background:var(--deep);border:1px solid var(--edge);border-radius:8px;padding:2px 10px;font-size:17px}
.chip small{font-family:var(--ui);font-size:11px;color:var(--muted);margin-left:5px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{--rc:var(--com);aspect-ratio:3/4;border-radius:14px;border:2px solid var(--rc);position:relative;overflow:hidden;
  background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 55%,#0c1c36) 0%,#0c1c36 88%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--deep),inset 0 0 0 1px rgba(255,255,255,.08)}
.card .k{font-family:var(--kyokasho);font-weight:600;font-size:52px;line-height:1.1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.card .rn{position:absolute;bottom:0;left:0;right:0;font-size:10px;font-weight:800;padding:3px 0;background:var(--rc);color:#10131a;letter-spacing:.06em}
.card .from{position:absolute;top:6px;left:8px;font-size:10px;color:rgba(255,255,255,.7)}
.card.locked{--rc:#2b4a78;background:#0e2242;border-style:dashed;box-shadow:none}
.card.locked .k{font-family:var(--display);font-size:34px;color:#2d4d80;text-shadow:none}
.r-legend{--rc:var(--legend)} .r-epic{--rc:var(--epic)} .r-rare{--rc:var(--rare)} .r-unc{--rc:var(--unc)} .r-com{--rc:var(--com)}
.legendrow{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-bottom:16px}
.legendrow span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--rc);margin-right:6px;vertical-align:-1px}
.legendrow b{color:var(--text);margin-left:4px}
.ggroup{margin-top:22px}
.ggroup h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:800}

/* modal */
.modal{position:fixed;inset:0;background:rgba(4,10,22,.78);display:grid;place-items:center;z-index:20;padding:16px;
  animation:fade .18s ease-out}
.mbox{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--edge);border-radius:22px;padding:24px;
  width:min(100%,520px);max-height:88dvh;overflow:auto;box-shadow:0 10px 0 var(--deep);text-align:center}
.mq{font-size:17px;font-weight:800;margin:4px 0 20px}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drop h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 4px;transform:skew(-8deg);color:var(--go)}
.drop p{color:var(--muted);margin:0 0 18px;font-size:14px}
.dcards{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.dcards .card{width:132px;animation:cardin .7s cubic-bezier(.2,1.4,.4,1) both}
.dcards .card .k{font-size:74px}
.dcards .card::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--rc) 50%,transparent),transparent 30%);
  animation:spin 3s linear infinite}
.dcards .card>*{position:relative}
.dw{font-size:13px;color:var(--muted);margin-top:8px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.sheet .sd{color:var(--muted);font-size:13px;margin:4px 0 16px}
.sheet .bosses{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.wlist{text-align:left;margin:14px 0 18px;display:grid;gap:6px}
.wlist div{display:flex;align-items:baseline;gap:10px;background:var(--deep);border-radius:10px;padding:6px 12px}
.wlist .ww{font-family:var(--kyokasho);font-weight:600;font-size:20px}
.wlist .wr{font-size:13px;color:var(--muted)}
.wlist .wm{margin-left:auto;font-size:12px;font-weight:800}
.wlist .wm.c{color:var(--ok)} .wlist .wm.m{color:var(--ng)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;border-radius:14px;
  padding:10px 18px;z-index:30;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}

/* parent */
.form{display:grid;gap:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow label{flex:1 1 150px}
label{display:block;font-size:12px;color:var(--muted);font-weight:800}
input,textarea{width:100%;margin-top:5px;background:var(--deep);border:2px solid var(--edge);border-radius:12px;color:var(--text);
  font:inherit;font-size:16px;padding:10px 12px;-webkit-user-select:text;user-select:text}
textarea{min-height:230px;line-height:1.7;font-family:var(--ui)}
.pnote{font-size:13px;color:var(--muted);margin:0;line-height:1.75}
.pnote b{color:var(--text)}
.pnote code{background:var(--deep);border-radius:5px;padding:1px 6px;color:var(--go);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.preview{font-size:13px;color:var(--muted);background:var(--deep);border-radius:12px;padding:10px 14px;line-height:1.8}
.preview .err{color:var(--ng)}
.preview .k{font-family:var(--kyokasho);font-weight:600;color:var(--go);font-size:16px;letter-spacing:.1em}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--edge);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--muted)}
td input{width:70px;margin:0;padding:6px 8px}
.delw{color:var(--ng);font-size:12px;font-weight:800}


/* Mテスト */
.mpanel{border-color:var(--storm);background:linear-gradient(180deg,#2a2466,#1b2a5a);margin-bottom:24px}
.mzones{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mz{position:relative;text-align:left;background:var(--deep);border:2px solid #4a3da0;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #120a3a}
.mz:active{transform:translateY(3px);box-shadow:0 2px 0 #120a3a}
.mzn{font-family:var(--display);font-size:22px;line-height:1.2}
.mzd{font-size:11px;color:var(--muted);margin:2px 0 8px;min-height:34px;line-height:1.5}

var $ = function(s,el){ return (el||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmt(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function today(){ return fmt(new Date()); }
function parseD(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function md(s){ var d=parseD(s); return (d.getMonth()+1)+'/'+d.getDate(); }
var WD='日月火水木金土';
function wd(s){ return WD[parseD(s).getDay()]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function KJ(s){ return Array.from(s).filter(function(c){ return /[㐀-鿿々]/.test(c); }); }
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }

/* ---------- sync (db when available, this device otherwise) ---------- */
var docRef=null, writeTimer=null, chain=Promise.resolve(), syncMode='local', firstSnap=true, pendingRemote=null;
function commit(){
  state.updatedAt=Date.now(); saveLocal();
  if(docRef){ clearTimeout(writeTimer); writeTimer=setTimeout(pushRemote,1200); }
}
function pushRemote(){
  writeTimer=null; if(!docRef) return;
  var body=JSON.parse(JSON.stringify(state));
  chain = chain.then(function(){ return docRef.set(body); }).catch(function(e){
    if(e && e.code==='invalid_argument'){ docRef=null; syncMode='local'; hud(); }
  });
}
function initSync(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  window.claude.use('db').then(function(db){
    if(!db) return;
    try{ docRef=db.doc('royale/state'); }catch(e){ return; }
    syncMode='on'; hud();
    docRef.onSnapshot(function(snap){
      var wasFirst=firstSnap; firstSnap=false;
      if(!snap.exists){ if(wasFirst && state.updatedAt) setTimeout(pushRemote,0); return; }
      var r=snap.data(); if(!r || r.v!==1) return;
      if((r.updatedAt||0)>(state.updatedAt||0)){
        var copy=JSON.parse(JSON.stringify(r));
        if(S){ pendingRemote=copy; } else { state=copy; saveLocal(); m5Seed(); render(); }
      } else if(wasFirst && (r.updatedAt||0)<(state.updatedAt||0)){ setTimeout(pushRemote,0); }
    }, function(){ syncMode='local'; hud(); });
  }).catch(function(){});
}

/* ---------- sound ---------- */
var AC=null;
function sfx(k){
  if(mute) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ return; }
  var seq={ok:[[660,.07],[990,.13]],ng:[[196,.2]],flip:[[540,.05]],drop:[[523,.08],[659,.08],[784,.08],[1047,.24]],
    win:[[392,.1],[523,.1],[659,.1],[784,.12],[1047,.4]],end:[[440,.1],[587,.18]]}[k];
  if(!seq) return;
  var t=AC.currentTime;
  seq.forEach(function(p){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type = k==='ng' ? 'square' : 'triangle'; o.frequency.value=p[0];
    var peak = k==='ng' ? .05 : .12;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+p[1]);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+p[1]+.03); t+=p[1]*.9;
  });
}

/* ---------- pools ---------- */
function computeBosses(words){
  var map={}, order=[];
  words.forEach(function(o){ uniq(KJ(o.w)).forEach(function(ch){ if(!map[ch]){ map[ch]=[]; order.push(ch); } map[ch].push(o.w); }); });
  var bosses=[], covered={};
  order.forEach(function(ch){ if(map[ch].length>=2){ bosses.push({ch:ch,words:map[ch]}); map[ch].forEach(function(w){ covered[w]=1; }); } });
  words.forEach(function(o){
    if(covered[o.w]) return; var ch=KJ(o.w)[0]; if(!ch) return;
    var b=bosses.find(function(x){ return x.ch===ch; }); if(!b){ b={ch:ch,words:[]}; bosses.push(b); }
    b.words.push(o.w); covered[o.w]=1;
  });
  return bosses;
}
var EMPTY=newRec();
function weeksSorted(){ return Object.keys(state.weeks).map(function(k){ return state.weeks[k]; }).sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }); }
function currentWeek(){ var t=today(), ws=weeksSorted(); return ws.find(function(w){ return w.date>=t; }) || ws[ws.length-1] || null; }
function weekPool(wk){ return {kind:'week',id:wk.id,title:'第'+wk.kai+'回',words:wk.words,bosses:computeBosses(wk.words),rec:wk.rec}; }
function islandPool(isl){
  var words=[], seen={}, rates={};
  isl.bosses.forEach(function(b){ b.words.forEach(function(x){ if(!seen[x.w]){ seen[x.w]=1; words.push(x); } rates[x.w]=x.rate; }); });
  var id='k'+isl.kai;
  return {kind:'rev',id:id,kai:isl.kai,title:'第'+isl.kai+'回アイランド',words:words,rates:rates,
    bosses:isl.bosses.map(function(b){ return {ch:b.ch,words:b.words.map(function(x){ return x.w; })}; }),
    rec:state.rev[id]||EMPTY};
}
function isClear(rec,w){ return !!(rec.st[w] && rec.st[w].s==='clear'); }
function hpOf(rec,b){ return b.words.filter(function(w){ return !isClear(rec,w); }).length; }
function wordObj(pool,w){ return pool.words.find(function(o){ return o.w===w; }); }

function streak(){
  var days={}; state.log.forEach(function(l){ days[l.d]=1; });
  var d=today(); if(!days[d]) d=addDays(d,-1);
  var n=0; while(days[d]){ n++; d=addDays(d,-1); } return n;
}

function doneOn(pid,m,d){ return state.log.some(function(l){ return l.p===pid && l.m===m && l.d===d; }); }

function parseWords(txt){
  var out=[], errs=[];
  txt.split(/\n/).forEach(function(line,i){
    line=line.trim(); if(!line) return;
    var parts=line.split(/[\s,、，　]+/);
    var w=parts.shift(), r=parts.shift(), c=parts.join(' ');
    if(!w || !KJ(w).length){ errs.push((i+1)+'行目：漢字の語が見つかりません'); return; }
    if(!r || !/^[ぁ-ゟーー]+$/.test(r)){ errs.push((i+1)+'行目「'+w+'」：読みをひらがなで入れてください'); return; }
    if(!c) c='{}';
    else if(c.indexOf('{}')<0){ c = c.indexOf(r)>=0 ? c.replace(r,'{}') : '{}（'+c+'）'; }
    out.push({w:w,r:r,c:c});
  });
  return {words:out,errs:errs};
}

var penSeen=false;
function Pad(host,n){
  host.innerHTML='<div class="pad" style="--n:'+n+'"><div class="cells">'+Array.from({length:n},function(){ return '<div class="cell"><span class="g"></span></div>'; }).join('')+'</div><canvas aria-label="ここに書く"></canvas></div>';
  var pad=host.firstElementChild, cv=pad.querySelector('canvas'), ctx=cv.getContext('2d');
  var W=1,H=1,strokes=[],cur=null,pid=null, api={onchange:null};
  function fit(){
    var r=pad.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
    W=Math.max(1,r.width); H=Math.max(1,r.height);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); redraw();
  }
  function lw(f){ return H*0.052*(0.5+0.9*f); }
  function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,f:(a.f+b.f)/2}; }
  function drawStroke(s){
    var p=s.p; if(!p.length) return;
    ctx.strokeStyle='#1a1a1a'; ctx.fillStyle='#1a1a1a'; ctx.lineCap='round'; ctx.lineJoin='round';
    if(p.length===1){ ctx.beginPath(); ctx.arc(p[0].x*W,p[0].y*H,lw(p[0].f)/2,0,Math.PI*2); ctx.fill(); return; }
    for(var i=1;i<p.length;i++){
      var a=p[i-1], b=p[i], s0=i>1?mid(p[i-2],a):a, s1=mid(a,b);
      ctx.beginPath(); ctx.lineWidth=lw(a.f); ctx.moveTo(s0.x*W,s0.y*H); ctx.quadraticCurveTo(a.x*W,a.y*H,s1.x*W,s1.y*H); ctx.stroke();
    }
    var L=p[p.length-1], M=mid(p[p.length-2],L);

  }
  function redraw(){ ctx.clearRect(0,0,W,H); strokes.forEach(drawStroke); if(cur) drawStroke(cur); }
  function pt(e){ var r=cv.getBoundingClientRect(); var f=e.pointerType==='pen'?(e.pressure||.5):.55; return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,f:f}; }
  cv.addEventListener('pointerdown',function(e){
    if(e.pointerType==='pen') penSeen=true;

    if(cur) return; e.preventDefault(); pid=e.pointerId;

  });

    if(!cur || e.pointerId!==pid) return; e.preventDefault();
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs.length) evs=[e];
    evs.forEach(function(ev){ cur.p.push(pt(ev)); }); redraw();
  });
  function end(e){ if(!cur || e.pointerId!==pid) return; strokes.push(cur); cur=null; pid=null; redraw(); if(api.onchange) api.onchange(); }

  cv.addEventListener('touchstart',function(e){ e.preventDefault(); },{passive:false});
  if(window.ResizeObserver) new ResizeObserver(fit).observe(pad); else setTimeout(fit,0);
  fit();
  api.clear=function(){ strokes=[]; cur=null; redraw(); if(api.onchange) api.onchange(); };
  api.undo=function(){ strokes.pop(); redraw(); if(api.onchange) api.onchange(); };
  api.empty=function(){ return strokes.length===0; };
  api.guide=function(text,cls){ var ch=Array.from(text); pad.querySelectorAll('.g').forEach(function(g,i){ g.textContent=ch[i]||''; g.className='g'+(cls?' '+cls:''); }); };

/* ---------- session ---------- */
function startSession(pid,mode){
  var P=poolById(pid); if(!P) return;
  if(P.kind==='rev'){ if(!state.rev[P.id]) state.rev[P.id]=newRec(); P.rec=state.rev[P.id]; }
  var list;
  if(mode==='study') list=P.words.slice();
  else if(mode==='battle') list=shuffle(P.words.filter(function(o){ return !isClear(P.rec,o.w); }));
  else list=shuffle(P.words.slice());
  if(!list.length){ toast('のこりの敵はいない！'); return; }
  if(mode==='battle') P.rec.sessions=(P.rec.sessions||0)+1;
  if(mode==='storm') P.rec.storm.tries++;
  S={pool:P,mode:mode,list:list,i:0,ok:0,ng:0,missed:[],drops:[],xp:0,drill:0,overlay:false,
     phase:mode==='study'?'study':'write',need:mode==='storm'?Math.ceil(list.length*0.9):0};
  commit(); window.scrollTo(0,0); renderSession();
}
var LABEL={study:'作戦会議',battle:'バトル',storm:'ファイナル・ストーム'};
function promptHTML(o){
  var parts=o.c.split('{}');
  return parts.map(esc).join('<span class="yomi">'+esc(o.r)+'</span>');
}
function stormHTML(){
  var allowed=S.list.length-S.need, left=allowed-S.ng, frac=left<0?0:(left+1)/(allowed+1);
  var r=6+34*frac;
  return '<div class="stormbox"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="#3a1d8a"/>'+
    '<circle cx="40" cy="40" r="38" fill="none" stroke="#8b5cff" stroke-width="3" stroke-dasharray="4 5"/>'+
    '<circle cx="40" cy="40" r="'+r.toFixed(1)+'" fill="'+(left<0?'#ff6b5b':'#7ef0c6')+'" opacity=".9"/></svg>'+
    '<div class="sl">'+(left>=0?'あと '+left+' ミスまでセーフ':'ストームの外！でも最後まで書こう')+'<small>'+S.need+'問 書けたらビクトリー</small></div>'+
    '<div class="sc">'+S.ok+'<small> / '+S.need+'</small></div></div>';
}
function renderSession(){
  if(S.kind==='m'){ renderM(); return; }
  document.body.classList.add('in-session');
  var v=$('#view');
  if(S.phase==='done'){ v.innerHTML=resultHTML(); return; }
  var o=S.list[S.i], P=S.pool, n=S.list.length;
  var foes=P.bosses.filter(function(b){ return b.words.indexOf(o.w)>=0; });
  var foeLabel = S.mode==='study' ? '<b>この字をおぼえよう</b><br>'+esc(P.title) : '<b>ボスの正体は？</b><br>書けたらダメージ';
  v.innerHTML='<div class="sess '+S.mode+'">'+
    '<div class="sbar"><button class="quit" data-act="quit" aria-label="やめる">×</button>'+
      '<span class="plate '+(S.mode==='storm'?'st':S.pool.kind==='rev'?'rv':'')+'"><span>'+LABEL[S.mode]+'</span></span>'+
      '<div class="pbar"><i style="width:'+(100*S.i/n)+'%"></i></div><div class="prog">'+(S.i+1)+' / '+n+'</div></div>'+
    (S.mode==='storm'?stormHTML():'')+
    '<div class="arena"><div class="foe">'+foes.map(function(b){ return bossHTML(P.rec,b,S.mode==='study'); }).join('')+'</div><div class="foe-l">'+foeLabel+'</div></div>'+
    '<div class="prompt">'+promptHTML(o)+'</div>'+

    '<div class="pad-wrap" id="padHost"></div>'+
    '<div id="ansHost"></div>'+
    '<div class="ctrl" id="ctrl"></div></div>';
  S.pad=Pad($('#padHost'),Array.from(o.w).length);
  S.pad.onchange=refreshBtns;
  setPhaseUI();
}
function setPhaseUI(){
  var o=S.list[S.i], ph=S.phase, hint={
    write:'赤いわくの読みを、<b>漢字で</b>書こう。送りがなもマスに書く。',
    study:'うすい字をなぞって書こう。<b>この日だけは見て書いてOK</b>。',
    judge:'下の正解と見くらべて、<b>自分で</b>丸つけ。トメ・ハネ・送りがなまで合っていたら○。',
    drill:'特訓！ 正解を見ながら <b>'+(S.drill+1)+' / 3</b> 回目。'
  }[ph];
  $('#hint').innerHTML=hint;
  if(ph==='study'||ph==='drill') S.pad.guide(o.w,'guide');
  else if(ph==='judge' && S.overlay) S.pad.guide(o.w,'over');
  else S.pad.guide('','');
  $('#ansHost').innerHTML = ph==='judge' ? '<div class="ans"><p class="ans-l">正解</p><div class="pad-wrap">'+staticRow(o.w)+'</div></div>' : '';
  var edit='<button class="btn ghost" data-act="undo">1つもどす</button><button class="btn ghost" data-act="clear">ぜんぶけす</button>';
  var c;
  if(ph==='write') c=edit+'<button class="btn go wide" data-act="check" data-need>こたえ合わせ</button>';
  else if(ph==='study') c=edit+'<button class="btn go wide" data-act="studynext" data-need>書けた！ つぎへ</button>';
  else if(ph==='drill') c=edit+'<button class="btn go wide" data-act="drillnext" data-need><span class="drillc">書けた '+(S.drill+1)+'/3</span></button>';
  else c='<button class="btn ghost" data-act="overlay">'+(S.overlay?'かさねない':'正解をかさねる')+'</button>'+
         '<button class="btn ng wide" data-act="ng">× まちがえた</button><button class="btn ok wide" data-act="ok">○ 書けた！</button>';
  $('#ctrl').innerHTML=c; refreshBtns();
}
function refreshBtns(){ var b=document.querySelector('[data-need]'); if(b) b.disabled=S.pad.empty(); }
function judge(ok){
  var o=S.list[S.i], w=o.w, rec=S.pool.rec;
  var st=rec.st[w] || (rec.st[w]={s:'new',n:0}); st.n++;
  if(ok){
    S.ok++; gain(10); if(st.s!=='clear'){ st.s='clear'; st.d=today(); }
    var defeated=[];
    S.pool.bosses.forEach(function(b){
      if(b.words.indexOf(w)<0 || rec.bosses[b.ch]) return;
      if(b.words.every(function(x){ return isClear(rec,x); })){
        var r=RAR_ORDER[Math.min(Math.max(rec.sessions||1,1),5)-1];
        rec.bosses[b.ch]={r:r,d:today()}; defeated.push({ch:b.ch,r:r,words:b.words}); gain(40);
      }
    });
    commit();
    if(defeated.length){ S.drops=S.drops.concat(defeated); sfx('drop'); showDrop(defeated,next); } else { sfx('ok'); next(); }
  } else {
    S.ng++; S.missed.push(w); if(st.s!=='clear') st.s='miss'; sfx('ng'); commit();
    if(S.mode==='battle'){ S.phase='drill'; S.drill=0; S.pad.clear(); setPhaseUI(); } else next();
  }
}
function showDrop(list,cb){
  var m=modal('<div class="drop"><h2>ボス撃破！</h2><p>正体は…</p><div class="dcards">'+list.map(function(d){ return cardHTML(d.ch,d.r); }).join('')+'</div>'+
    list.map(function(d){ return '<p class="dw">'+RAR[d.r]+' ・ '+d.words.map(esc).join('・')+'</p>'; }).join('')+
    '<p style="margin-top:14px"><button class="btn go big" data-v="go">つぎへ</button></p></div>');
  m.addEventListener('click',function(e){ if(e.target.closest('[data-v]')){ m.remove(); cb(); } });
}
function next(){
  S.i++;
  if(S.i>=S.list.length){ finish(); return; }
  S.phase=S.mode==='study'?'study':'write'; S.overlay=false; renderSession(); window.scrollTo(0,0);
}
function finish(){
  var rec=S.pool.rec, win=false;
  if(S.mode==='study'){ rec.studied=true; gain(30); }
  if(S.mode==='storm'){
    win=S.ok>=S.need;
    if(rec.storm.best==null || S.ok>rec.storm.best) rec.storm.best=S.ok;
    if(win){ rec.storm.won=true; gain(150); }
  }
  logSession();
  S.phase='done'; S.win=win; commit(); renderSession();
  if(win){ sfx('win'); confetti(); } else sfx('end');
}
function logSession(){
  state.log.push({d:today(),m:S.mode,p:S.pool.id,ok:S.ok,ng:S.ng});
  if(state.log.length>500) state.log=state.log.slice(-500);
}
function resultHTML(){
  var h, cls='', sub;
  if(S.mode==='storm'){ cls=S.win?'win':'lose'; h=S.win?'ビクトリー！':'ストームに飲まれた…'; sub=S.win?S.list.length+'問中 '+S.ok+'問。本番もこの調子！':'あと '+(S.need-S.ok)+'問。まちがえた語をもう一度見てから再挑戦しよう。'; }
  else if(S.mode==='study'){ h='作戦会議おわり！'; sub='この字たちが今週のボス。あしたのバトルで倒そう。'; }
  else { h='バトル終了！'; sub=S.missed.length?'まちがえた語は、つぎのバトルでまた出てくるよ。':'全問書けた！ パーフェクト！'; }
  var drops=S.drops.length?'<p class="ans-l">手に入れたカード</p><div class="dcards">'+S.drops.map(function(d){ return cardHTML(d.ch,d.r); }).join('')+'</div>':'';
  var miss=S.missed.length?'<p class="ans-l">まちがえた語</p><div class="chips">'+uniq(S.missed).map(function(w){ var o=wordObj(S.pool,w); return '<span class="chip">'+esc(w)+'<small>'+esc(o?o.r:'')+'</small></span>'; }).join('')+'</div>':'';
  var stats=S.mode==='study'?'<div><b>'+S.list.length+'</b><span>書いた語</span></div>':'<div><b>'+S.ok+'</b><span>○ 書けた</span></div><div><b>'+S.ng+'</b><span>× まちがえた</span></div>';
  var again=S.mode==='storm'&&!S.win?'<button class="btn storm" data-act="play" data-pool="'+S.pool.id+'" data-mode="storm">もう一度ストーム</button>':'';
  return '<div class="result '+cls+'"><span class="plate '+(S.mode==='storm'?'st':'')+'"><span>'+LABEL[S.mode]+'</span></span><h1>'+h+'</h1><p class="rsub">'+sub+'</p>'+
    '<div class="rstats">'+stats+'<div><b>+'+S.xp+'</b><span>XP</span></div></div>'+drops+miss+
    '<div class="mrow">'+again+'<button class="btn go big" data-act="lobby">ロビーへ</button></div></div>';
}
function endSession(){
  S=null; document.body.classList.remove('in-session');
  if(pendingRemote && (pendingRemote.updatedAt||0)>(state.updatedAt||0)){ state=pendingRemote; saveLocal(); m5Seed(); }

}

function mKanji(){
  var out=[],seen={};
  BACKLOG.forEach(function(I){
    if([28,29].indexOf(I.kai)<0) return;
    I.bosses.forEach(function(b){ b.words.forEach(function(x){
      if(seen[x.w]) return; seen[x.w]=1;
      out.push({id:'k:'+x.w,t:'kw',w:x.w,r:x.r,c:x.c,a:x.w,rate:x.rate,src:'第'+I.kai+'回の漢字で× ・ クラスの'+Math.round(x.rate)+'％が書けた'});
    }); });
  });
  out.sort(function(a,b){ return b.rate-a.rate; });
  var seenW={}; out.forEach(function(x){ seenW[x.w]=1; });
  tkanItems().forEach(function(x){ if(!seenW[x.w]) out.push(x); });
  return out;
}

M5G('sci','banech','大問5(4) ばねの直列つなぎ',function(){
  var L=PK([8,10,12]), k=PK([1,2,2.5]), w=PK([20,30,40,60]), s=k*w/10, a=2*(L+s);

function zoneBank(z){
  return zoneBase(z).concat(m5Of(z));
}
function zoneBase(z){
  if(z==='kan') return mKanji();
  if(z==='math') return MATH.concat(MATHT).concat(MATHC);
  if(z==='jp') return JP.concat(JPT);
  if(z==='sci') return SCI.concat(SCIG.filter(function(g){ return g.id!=='g-jisa'; }));
  return SOC.concat(SOCT).concat(SCIG.filter(function(g){ return g.id==='g-jisa'; }));
}
function mrec(z){ if(!state.m) state.m={}; return state.m[z]||(state.m[z]={st:{},runs:0}); }
function mrecRO(z){ return (state.m&&state.m[z])||{st:{},runs:0}; }
function materialize(i){
  if(i.f){ var g=i.f(); g.t=g.t||'n'; if(g.t==='c') g.ch=shuffle(g.ch); g.id=i.id; g.src=i.src; return g; }
  var o={}; for(var k in i) o[k]=i[k];
  if(o.t==='c') o.ch=shuffle(o.ch);
  return o;
}
function buildRun(z){
  var rec=mrecRO(z), bank=zoneBank(z), size=15;
  var miss=bank.filter(function(i){ return rec.st[i.id]==='miss'; });
  var fresh=bank.filter(function(i){ return !rec.st[i.id]; });
  var done=bank.filter(function(i){ return rec.st[i.id]==='clear'; });
  var pick=shuffle(miss).concat(shuffle(fresh));
  if(pick.length<size) pick=pick.concat(shuffle(done));
  return shuffle(pick.slice(0,size)).map(materialize);
}
function mZoneStat(z){
  var rec=mrecRO(z), bank=zoneBank(z), c=0, m=0;
  bank.forEach(function(i){ if(rec.st[i.id]==='clear') c++; else if(rec.st[i.id]==='miss') m++; });
  return {c:c,m:m,n:bank.length,runs:rec.runs||0};
}

    var lq=(mrecRO(z.k).lq)||{};
    return '<h3 class="rlh">'+z.n+'（'+ms.length+'）</h3><div class="mmiss">'+ms.map(function(i){
      var last=lq[i.id]; var q=last?last[0]:(i.t==='kw'?i.r+'（'+i.c.replace('{}','＿')+'）':(i.q||i.src)); var a=last?last[1]:(i.a!=null?i.a:'');
      return '<div><span>'+esc(q)+'</span><b>'+esc(String(a))+'</b></div>';
    }).join('')+'</div>';
  }).join('');
  var m=modal('<p class="mq">×の問題と答え</p><div style="text-align:left">'+rows+'</div><p style="margin-top:16px"><button class="btn go" data-v="1">とじる</button></p>');
  m.addEventListener('click',function(e){ if(e.target.closest('[data-v]')||e.target===m) m.remove(); });
}
function reviewResultHTML(){
  var left=missCounts().all, perfect=S.ng===0;
  return '<div class="result '+(perfect?'win':'')+'"><span class="plate rv"><span>まちがい直し</span></span>'+
    '<h1>'+(left?'のこり '+left+' 問':'×ぜんぶクリア！')+'</h1><p class="rsub">'+(left?'まだ×が残っているよ。もう1回で減らそう。':'まちがえた問題を、ぜんぶ取り返した！')+'</p>'+
    '<div class="rstats"><div><b>'+S.ok+'</b><span>取り返した</span></div><div><b>'+S.ng+'</b><span>まだ×</span></div><div><b>+'+S.xp+'</b><span>XP</span></div></div>'+
    (S.missed.length?'<p class="ans-l">まだ×の問題</p><div class="mmiss">'+S.missed.map(function(it){ return '<div><span>'+esc(qText(it))+'</span><b>'+esc(fmtAns(it))+'</b></div>'; }).join('')+'</div>':'')+
    '<div class="mrow">'+(left?'<button class="btn storm" data-act="rplay" data-z="'+esc(S.review)+'">もう1回</button>':'')+'<button class="btn go big" data-act="lobby">ロビーへ</button></div></div>';
}

/* ---------- 計算用紙 ---------- */
function Scratch(host,strokes){
  host.innerHTML='<div class="scr"><div class="scr-h"><span>計算用紙</span><button class="scr-b" data-scr="undo">1つもどす</button><button class="scr-b" data-scr="clear">ぜんぶけす</button></div><div class="scr-p"><canvas aria-label="計算用紙"></canvas></div></div>';
  var box=host.querySelector('.scr-p'), cv=box.querySelector('canvas'), ctx=cv.getContext('2d'), W=1,H=1,cur=null,pid=null;
  function fit(){ var r=box.getBoundingClientRect(), d=Math.min(3,window.devicePixelRatio||1); W=Math.max(1,r.width); H=Math.max(1,r.height);
    cv.width=Math.round(W*d); cv.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0); redraw(); }
  function line(s){ var p=s.p; ctx.strokeStyle='#1a1a1a'; ctx.fillStyle='#1a1a1a'; ctx.lineCap='round'; ctx.lineJoin='round';
    if(p.length===1){ ctx.beginPath(); ctx.arc(p[0].x,p[0].y,p[0].w/2,0,7); ctx.fill(); return; }
    for(var i=1;i<p.length;i++){ ctx.beginPath(); ctx.lineWidth=p[i].w; ctx.moveTo(p[i-1].x,p[i-1].y); ctx.lineTo(p[i].x,p[i].y); ctx.stroke(); } }
  function redraw(){ ctx.clearRect(0,0,W,H); strokes.forEach(line); if(cur) line(cur); }
  function pt(e){ var r=cv.getBoundingClientRect(), f=e.pointerType==='pen'?(e.pressure||.5):.5; return {x:e.clientX-r.left,y:e.clientY-r.top,w:1.4+2.6*f}; }
  cv.addEventListener('pointerdown',function(e){ if(e.pointerType==='pen') penSeen=true; if(e.pointerType==='touch'&&penSeen) return; if(cur) return;
    e.preventDefault(); pid=e.pointerId; try{ cv.setPointerCapture(pid); }catch(_){} cur={p:[pt(e)]}; redraw(); });
  cv.addEventListener('pointermove',function(e){ if(!cur||e.pointerId!==pid) return; e.preventDefault();
    var ev=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!ev.length) ev=[e]; ev.forEach(function(x){ cur.p.push(pt(x)); }); redraw(); });
  function end(e){ if(!cur||e.pointerId!==pid) return; strokes.push(cur); cur=null; pid=null; redraw(); }
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('touchstart',function(e){ e.preventDefault(); },{passive:false});
  host.querySelector('.scr-h').addEventListener('click',function(e){ var b=e.target.closest('[data-scr]'); if(!b) return;
    if(b.dataset.scr==='undo') strokes.pop(); else strokes.length=0; redraw(); });
  if(window.ResizeObserver) new ResizeObserver(fit).observe(box); fit();
}
function needScratch(it){ return it.t==='n' || (it.zone||S.zone)==='math'; }

/* M session */
function startM(z){
  var list=buildRun(z); if(!list.length){ toast('問題がありません'); return; }
  mrec(z).runs=(mrec(z).runs||0)+1;
  S={kind:'m',zone:z,pool:{id:'mtest'},mode:'m-'+z,list:list,i:0,ok:0,ng:0,missed:[],xp:0,drops:[]};
  mSetPhase(); commit(); window.scrollTo(0,0); renderM();
}
function mSetPhase(){ var it=S.list[S.i]; S.scratch=[]; S.phase=it.t==='c'?'choose':it.t==='n'?'input':'write'; S.input=''; S.picked=null; S.overlay=false; S.drill=0; }
function zoneName(z){ return MZ.find(function(x){ return x.k===z; }).n; }
function renderM(){
  document.body.classList.add('in-session');
  var v=$('#view');
  if(S.phase==='done'){ v.innerHTML=mResultHTML(); return; }
  var it=S.list[S.i], n=S.list.length;
  var head='<div class="sess m">'+
    '<div class="sbar"><button class="quit" data-act="quit" aria-label="やめる">×</button>'+
    '<span class="plate st"><span>'+esc(it.stage||('Mテスト対策・'+zoneName(S.zone)))+'</span></span>'+
    '<div class="pbar"><i style="width:'+(100*S.i/n)+'%"></i></div><div class="prog">'+(S.i+1)+' / '+n+'</div></div>'+
    '<p class="srcchip">'+esc(it.src||'')+'</p>';
  var prompt = it.t==='kw' ? promptHTML({c:it.c,r:it.r}) : (esc(it.q)+(it.tbl?tblHTML(it.tbl):''));
  var body='';
  if(it.t==='kw'||it.t==='w'){
    body='<div class="prompt">'+prompt+'</div><p class="hint" id="hint"></p><div class="pad-wrap" id="padHost"></div><div id="ansHost"></div><div class="ctrl" id="ctrl"></div>';
    v.innerHTML=head+body+'</div>';
    S.pad=Pad($('#padHost'),Array.from(it.a).length); S.pad.onchange=mRefresh; mWriteUI(); return;
  }
  if(it.t==='c'){
    var shown=S.phase==='shown';
    var chs='<div class="choices">'+it.ch.map(function(c,i){
      var cls=''; if(shown){ if(c===it.a) cls='right'; else if(i===S.picked) cls='wrong'; }
      return '<button class="choice '+cls+'" data-act="mpick" data-i="'+i+'" '+(shown?'disabled':'')+'>'+esc(c)+'</button>';
    }).join('')+'</div>';
    body='<div class="prompt">'+prompt+'</div>'+(needScratch(it)?'<div class="calcwrap"><div id="scrHost"></div><div>'+chs+'</div></div>':chs);
  } else {
    var shownN=S.phase==='shown';
    body='<div class="prompt">'+prompt+'</div><div class="calcwrap"><div id="scrHost"></div><div>'+
      '<div class="numrow"><div class="numdisp '+(shownN?(S.lastOk?'right':'wrong'):'')+'">'+(esc(S.input)||'<span style="opacity:.35">?</span>')+'</div><div class="numu">'+esc(it.u||'')+'</div></div>'+
      (shownN?'':'<div class="keypad">'+['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(function(k){ return '<button class="key" data-act="key" data-k="'+k+'">'+k+'</button>'; }).join('')+'</div>'+
      '<div class="ctrl"><button class="btn go wide" data-act="msubmit" '+(S.input?'':'disabled')+'>こたえる</button></div>')+'</div></div>';
  }
  if(S.phase==='shown'){
    var ok=S.lastOk;
    body+='<div class="expl '+(ok?'ok':'ng')+'"><b>'+(ok?'○ 正解！':'× 正解は「'+esc(fmtAns(it))+'」')+'</b><p>'+esc(it.e||'')+'</p></div>'+
      '<div class="ctrl"><button class="btn go wide big" data-act="mnext">つぎへ</button></div>';
  }
  v.innerHTML=head+body+'</div>';
  var sh=document.getElementById('scrHost'); if(sh) Scratch(sh,S.scratch);
}
function fmtAns(it){ return it.t==='n' ? fmtN(it.a)+(it.u||'') : it.a; }
function mWriteUI(){
  var it=S.list[S.i], ph=S.phase;
  $('#hint').innerHTML={write:it.t==='kw'?'赤いわくの読みを、<b>漢字で</b>書こう。':'答えを<b>書いて</b>から、こたえ合わせ。1マスに1字。',
    judge:'正解と見くらべて、<b>自分で</b>丸つけ。',drill:'正解を見ながら、もう<b>1回</b>書こう。'}[ph];
  if(ph==='drill') S.pad.guide(it.a,'guide'); else if(ph==='judge'&&S.overlay) S.pad.guide(it.a,'over'); else S.pad.guide('','');
  $('#ansHost').innerHTML = ph==='judge' ? '<div class="ans"><p class="ans-l">正解'+(it.alt?'（'+esc(it.alt)+' でも○）':'')+'</p><div class="pad-wrap">'+staticRow(it.a)+'</div>'+(it.e?'<p class="expl-s">'+esc(it.e)+'</p>':'')+'</div>' : '';
  var edit='<button class="btn ghost" data-act="undo">1つもどす</button><button class="btn ghost" data-act="clear">ぜんぶけす</button>';
  var c = ph==='write' ? edit+'<button class="btn go wide" data-act="mcheck" data-need>こたえ合わせ</button>'
        : ph==='drill' ? edit+'<button class="btn go wide" data-act="mdrill" data-need>書けた → つぎへ</button>'
        : '<button class="btn ghost" data-act="moverlay">'+(S.overlay?'かさねない':'正解をかさねる')+'</button><button class="btn ng wide" data-act="mng">× まちがえた</button><button class="btn ok wide" data-act="mok">○ 書けた！</button>';
  $('#ctrl').innerHTML=c; mRefresh();
}
function mRefresh(){ var b=document.querySelector('[data-need]'); if(b) b.disabled=S.pad.empty(); }
function mScore(ok){
  var it=S.list[S.i], rec=mrec(it.zone||S.zone);
  if(!rec.lq) rec.lq={}; rec.lq[it.id]=[qText(it), fmtAns(it)];
  if(ok){ S.ok++; gain(10); rec.st[it.id]='clear'; sfx('ok'); }
  else { S.ng++; S.missed.push(it); if(rec.st[it.id]!=='clear') rec.st[it.id]='miss'; else rec.st[it.id]='miss'; sfx('ng'); }
  commit();
}
function mNext(){
  S.i++;
  if(S.i>=S.list.length){ if(S.course){ crec().done[S.course]=true; gain(30); } logSession(); gain(20); S.phase='done'; commit(); renderM(); if(S.ng===0){ sfx('win'); confetti(); } else sfx('end'); window.scrollTo(0,0); return; }
  mSetPhase(); renderM(); window.scrollTo(0,0);
}
function mResultHTML(){
  if(S.m5) return m5ResultHTML();
  if(S.review) return reviewResultHTML();
  if(S.course) return courseResultHTML();
  var s=mZoneStat(S.zone), perfect=S.ng===0;
  var miss=S.missed.length?'<p class="ans-l">まちがえた問題（つぎの出撃でまた出るよ）</p><div class="mmiss">'+S.missed.map(function(it){
    var q = it.t==='kw' ? it.r+'（'+it.c.replace('{}','＿')+'）' : it.q;
    return '<div><span>'+esc(q)+'</span><b>'+esc(fmtAns(it))+'</b></div>';
  }).join('')+'</div>':'';
  return '<div class="result '+(perfect?'win':'')+'"><span class="plate st"><span>Mテスト対策・'+zoneName(S.zone)+'</span></span>'+
    '<h1>'+(perfect?'パーフェクト！':'ゾーン終了！')+'</h1><p class="rsub">このゾーンの進み具合　○ '+s.c+' / '+s.n+'</p>'+
    '<div class="rstats"><div><b>'+S.ok+'</b><span>○ 正解</span></div><div><b>'+S.ng+'</b><span>× まちがい</span></div><div><b>+'+S.xp+'</b><span>XP</span></div></div>'+miss+
    '<div class="mrow"><button class="btn storm" data-act="mplay" data-z="'+S.zone+'">もう1回出撃</button><button class="btn go big" data-act="lobby">ロビーへ</button></div></div>';
}

/* ---------- backup ---------- */
function exportData(){
  var name='kanji-royale-'+today()+'.json';
  var blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  var file=null; try{ file=new File([blob],name,{type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(function(){}); return; }
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
}

/* ---------- render / events ---------- */
function render(){
  if(S){ renderSession(); return; }
  document.body.classList.remove('in-session');
  hud(); tabs();
  $('#view').innerHTML = view==='locker'?lockerHTML():view==='parent'?parentHTML():lobbyHTML();
  if(view==='parent') bindParent();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a=b.dataset.act;
  if(a==='tab'){ view=b.dataset.v; render(); window.scrollTo(0,0); }
  else if(a==='mute'){ mute=!mute; try{ localStorage.setItem(LSM,mute?'1':'0'); }catch(_){} hud(); }
  else if(a==='play'){ var pid=b.dataset.pool==='week'?(currentWeek()||{}).id:b.dataset.pool; if(S && S.phase==='done') S=null; if(pid) startSession(pid,b.dataset.mode); }
  else if(a==='island'){ islandSheet(parseInt(b.dataset.kai,10)); }
  else if(a==='card'){ cardSheet(b.dataset.pool,b.dataset.ch); }
  else if(a==='howto'){ var m=modal('<p class="mq">おうちの人へ</p><p class="pnote" style="text-align:left">画面下の「おうちの人」を<b>長押し</b>すると入力画面が開きます。コアマスターの今週の漢字ページ（p.14 / 26 / 38 / 50 のどれか）から20語を、<code>漢字 よみ 例文</code> の形で1行ずつ入れてください。</p><p style="margin-top:16px"><button class="btn go" data-v="1">わかった</button></p>'); m.addEventListener('click',function(ev){ if(ev.target.closest('[data-v]')||ev.target===m) m.remove(); }); }
  else if(a==='saveweek'){ saveWeek(); }
  else if(a==='export'){ exportData(); }
  else if(a==='delweek'){ var id=b.dataset.id; ask('この週の記録を削除しますか？ 取り消せません。','削除する').then(function(y){ if(y){ delete state.weeks[id]; commit(); render(); } }); }
  else if(a==='lobby'){ endSession(); }
  else if(a==='quit'){
    ask('バトルをやめる？ ここまでの結果は残るよ。','やめる','つづける').then(function(y){
      if(!y) return; if(S.ok+S.ng>0 || S.mode==='study' && S.i>0){ logSession(); commit(); } endSession();
    });
  }
  else if(a==='rplay'){ if(S && S.phase==='done') S=null; if(!S) startReview(b.dataset.z); }
  else if(a==='m5play'){ if(S && S.phase==='done') S=null; if(!S) startM5(b.dataset.z); }
  else if(a==='m5list'){ m5ListModal(); }
  else if(a==='rlist'){ reviewListModal(); }
  else if(a==='cplay'){ if(S && S.phase==='done') S=null; if(!S) startCourse(parseInt(b.dataset.n,10)); }
  else if(a==='mplay'){ if(S && S.phase==='done') S=null; if(!S) startM(b.dataset.z); }
  else if(!S) return;
  else if(S.kind==='m'){
    var it=S.list[S.i];
    if(a==='undo') S.pad.undo();
    else if(a==='clear') S.pad.clear();
    else if(a==='mcheck'){ S.phase='judge'; sfx('flip'); mWriteUI(); }
    else if(a==='moverlay'){ S.overlay=!S.overlay; mWriteUI(); }
    else if(a==='mok'){ mScore(true); mNext(); }
    else if(a==='mng'){ mScore(false); S.phase='drill'; S.pad.clear(); mWriteUI(); }
    else if(a==='mdrill'){ mNext(); }
    else if(a==='mpick'){ var i=parseInt(b.dataset.i,10); S.picked=i; S.lastOk=it.ch[i]===it.a; mScore(S.lastOk); S.phase='shown'; renderM(); }
    else if(a==='key'){ var k=b.dataset.k; if(k==='⌫') S.input=S.input.slice(0,-1); else if(k==='.'){ if(S.input.indexOf('.')<0) S.input=(S.input||'0')+'.'; } else if(S.input.length<9) S.input=(S.input==='0'?'':S.input)+k; renderM(); }
    else if(a==='msubmit'){ if(!S.input) return; S.lastOk=Math.abs(parseFloat(S.input)-it.a)<0.001; mScore(S.lastOk); S.phase='shown'; renderM(); }
    else if(a==='mnext'){ mNext(); }
  }
  else if(a==='undo') S.pad.undo();
  else if(a==='clear') S.pad.clear();
  else if(a==='check'){ S.phase='judge'; sfx('flip'); setPhaseUI(); }
  else if(a==='overlay'){ S.overlay=!S.overlay; setPhaseUI(); }
  else if(a==='ok') judge(true);
  else if(a==='ng') judge(false);
  else if(a==='studynext'){ next(); }
  else if(a==='drillnext'){ S.drill++; if(S.drill>=3){ gain(5); commit(); next(); } else { S.pad.clear(); setPhaseUI(); } }
});

m5Seed();
render();
initSync();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>
